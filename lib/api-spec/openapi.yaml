openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 2.2.0
  description: Construction AI Platform — Phase 2 API (routes match FastAPI backend exactly)
servers:
  - url: /api
    description: Base API path (Python FastAPI backend)
tags:
  - name: health
    description: Health checks
  - name: auth
    description: Authentication
  - name: dashboard
    description: Dashboard metrics
  - name: projects
    description: Projects
  - name: procurement
    description: Purchase requests and orders
  - name: suppliers
    description: Suppliers
  - name: siteReports
    description: Site reports (project-scoped)
  - name: safety
    description: Safety events and NCRs (project-scoped)
  - name: meetings
    description: Meetings and decisions (project-scoped)
  - name: risks
    description: Project risks and issues (Sprint 2/3 — workflow + ownership)
  - name: notifications
    description: Persistent in-app notifications (Sprint 4)
  - name: myWork
    description: Unified My Work feed (Sprint 4/5)
  - name: approvals
    description: Approval Engine (Sprint 5)
  - name: documents
    description: Document storage — versions, download, archive (Sprint 1/6)
  - name: admin
    description: Admin-only user management
  - name: claims
    description: Claims (read-only source-entity context for approvals)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    UserOut:
      type: object
      required: [id, email, role, is_active, created_at]
      properties:
        id:
          type: integer
        email:
          type: string
        full_name:
          type: ["string", "null"]
        role:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        must_change_password:
          type: boolean
          description: Phase 2 — Security & Authentication Hardening

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RegisterInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        full_name:
          type: ["string", "null"]
        role:
          type: string
          default: site_engineer

    TokenResponse:
      type: object
      required: [access_token, token_type, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
        user:
          $ref: "#/components/schemas/UserOut"

    DashboardSummary:
      type: object
      required:
        - total_projects
        - active_projects
        - completed_projects
        - delayed_projects
        - on_hold_projects
        - total_suppliers
        - active_suppliers
        - total_purchase_requests
        - open_purchase_requests
        - total_purchase_orders
        - late_purchase_orders
        - total_safety_events
        - high_severity_events
        - total_ncrs
        - open_ncrs
        - total_site_reports
        - total_meetings
        - total_decisions
      properties:
        total_projects:
          type: integer
        active_projects:
          type: integer
        completed_projects:
          type: integer
        delayed_projects:
          type: integer
        on_hold_projects:
          type: integer
        total_suppliers:
          type: integer
        active_suppliers:
          type: integer
        total_purchase_requests:
          type: integer
        open_purchase_requests:
          type: integer
        total_purchase_orders:
          type: integer
        late_purchase_orders:
          type: integer
        total_safety_events:
          type: integer
        high_severity_events:
          type: integer
        total_ncrs:
          type: integer
        open_ncrs:
          type: integer
        total_site_reports:
          type: integer
        total_meetings:
          type: integer
        total_decisions:
          type: integer

    HealthScoreOut:
      type: object
      required: [project_id, project_code, project_name, status, score, level, reasons,
                 schedule_penalty, safety_penalty, ncr_penalty, procurement_penalty, risk_penalty]
      properties:
        project_id:
          type: integer
        project_code:
          type: string
        project_name:
          type: string
        status:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        level:
          type: string
          enum: [Excellent, Good, "At Risk", Critical]
        reasons:
          type: array
          items:
            type: string
        schedule_penalty:
          type: number
        safety_penalty:
          type: number
        ncr_penalty:
          type: number
        procurement_penalty:
          type: number
        risk_penalty:
          type: number

    Project:
      type: object
      required: [id, project_code, project_name, project_type, client_name, city, start_date, planned_finish, status, budget]
      properties:
        id:
          type: integer
        project_code:
          type: string
        project_name:
          type: string
        project_type:
          type: string
        client_name:
          type: string
        city:
          type: string
        start_date:
          type: string
        planned_finish:
          type: string
        actual_finish:
          type: ["string", "null"]
        status:
          type: string
        budget:
          type: number

    Supplier:
      type: object
      required: [id, supplier_name, category, city, status]
      properties:
        id:
          type: integer
        supplier_name:
          type: string
        category:
          type: string
        city:
          type: string
        status:
          type: string

    PurchaseRequest:
      type: object
      required: [id, project_id, request_no, status, created_at]
      properties:
        id:
          type: integer
        project_id:
          type: integer
        request_no:
          type: string
        material_category:
          type: ["string", "null"]
        specification:
          type: ["string", "null"]
        required_delivery_date:
          type: ["string", "null"]
        status:
          type: string
        rework_reason:
          type: ["string", "null"]
        created_at:
          type: string
        # Core Workflow Engine (Sprint 2)
        updated_at:
          type: ["string", "null"]
          format: date-time
        updated_by:
          type: ["integer", "null"]
        # Ownership Engine (Sprint 3)
        owner_id:
          type: ["integer", "null"]
        assigned_by:
          type: ["integer", "null"]
        assigned_at:
          type: ["string", "null"]
          format: date-time

    PurchaseOrder:
      type: object
      required: [id, pr_id, project_id, supplier_id, po_number, issue_date, promised_delivery, status, is_late, delay_days]
      properties:
        id:
          type: integer
        pr_id:
          type: integer
        project_id:
          type: integer
        supplier_id:
          type: integer
        po_number:
          type: string
        issue_date:
          type: string
        promised_delivery:
          type: string
        actual_delivery:
          type: ["string", "null"]
        status:
          type: string
        is_late:
          type: boolean
        delay_days:
          type: integer
        delay_root_cause:
          type: ["string", "null"]

    SiteReport:
      type: object
      required: [id, project_id, report_date, weather, summary]
      properties:
        id:
          type: integer
        project_id:
          type: integer
        report_date:
          type: string
        weather:
          type: string
        summary:
          type: string

    SafetyEvent:
      type: object
      required: [id, project_id, subcontractor_id, event_date, severity, description, corrective_action]
      properties:
        id:
          type: integer
        project_id:
          type: integer
        subcontractor_id:
          type: integer
        event_date:
          type: string
        severity:
          type: string
        description:
          type: string
        corrective_action:
          type: string
        # Core Workflow Engine (Sprint 2)
        status:
          type: string
          default: Open
        updated_at:
          type: ["string", "null"]
          format: date-time
        updated_by:
          type: ["integer", "null"]
        # Ownership Engine (Sprint 3)
        owner_id:
          type: ["integer", "null"]
        assigned_by:
          type: ["integer", "null"]
        assigned_at:
          type: ["string", "null"]
          format: date-time

    Ncr:
      type: object
      required: [id, project_id, ncr_type, description, root_cause, issue_date, status]
      properties:
        id:
          type: integer
        project_id:
          type: integer
        supplier_id:
          type: ["integer", "null"]
        subcontractor_id:
          type: ["integer", "null"]
        ncr_type:
          type: string
        description:
          type: string
        root_cause:
          type: string
        issue_date:
          type: string
        status:
          type: string
        # Core Workflow Engine (Sprint 2)
        corrective_action:
          type: ["string", "null"]
        updated_at:
          type: ["string", "null"]
          format: date-time
        updated_by:
          type: ["integer", "null"]
        # Ownership Engine (Sprint 3)
        owner_id:
          type: ["integer", "null"]
        assigned_by:
          type: ["integer", "null"]
        assigned_at:
          type: ["string", "null"]
          format: date-time

    Meeting:
      type: object
      required: [id, project_id, meeting_date, title, meeting_type]
      properties:
        id:
          type: integer
        project_id:
          type: integer
        meeting_date:
          type: string
        title:
          type: string
        meeting_type:
          type: string

    ProjectDecision:
      type: object
      required: [id, project_id, meeting_id, decision_date, decision_text, owner]
      properties:
        id:
          type: integer
        project_id:
          type: integer
        meeting_id:
          type: integer
        decision_date:
          type: string
        decision_text:
          type: string
        owner:
          type: string

    # ── Sprint 2/3 — Project Risks & Issues (new to the client) ─────────────
    ProjectRisk:
      type: object
      required: [id, project_id, title, status]
      properties:
        id:
          type: integer
        project_id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        probability:
          type: string
          default: medium
        impact:
          type: string
          default: medium
        status:
          type: string
          default: open
        owner:
          type: ["string", "null"]
        mitigation:
          type: ["string", "null"]
        updated_at:
          type: ["string", "null"]
          format: date-time
        updated_by:
          type: ["integer", "null"]
        owner_id:
          type: ["integer", "null"]
        assigned_by:
          type: ["integer", "null"]
        assigned_at:
          type: ["string", "null"]
          format: date-time

    ProjectRiskCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        probability:
          type: string
          default: medium
        impact:
          type: string
          default: medium
        status:
          type: string
          default: open
        owner:
          type: ["string", "null"]
        mitigation:
          type: ["string", "null"]

    ProjectRiskUpdate:
      type: object
      properties:
        status:
          type: ["string", "null"]
        owner:
          type: ["string", "null"]
        mitigation:
          type: ["string", "null"]
        probability:
          type: ["string", "null"]
        impact:
          type: ["string", "null"]
        expected_updated_at:
          type: ["string", "null"]
          format: date-time

    ProjectIssue:
      type: object
      required: [id, project_id, title, status]
      properties:
        id:
          type: integer
        project_id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        severity:
          type: string
          default: medium
        status:
          type: string
          default: open
        owner:
          type: ["string", "null"]
        resolution:
          type: ["string", "null"]
        resolved_at:
          type: ["string", "null"]
        updated_at:
          type: ["string", "null"]
          format: date-time
        updated_by:
          type: ["integer", "null"]
        owner_id:
          type: ["integer", "null"]
        assigned_by:
          type: ["integer", "null"]
        assigned_at:
          type: ["string", "null"]
          format: date-time

    ProjectIssueCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        severity:
          type: string
          default: medium
        status:
          type: string
          default: open
        owner:
          type: ["string", "null"]
        resolution:
          type: ["string", "null"]

    ProjectIssueUpdate:
      type: object
      properties:
        status:
          type: ["string", "null"]
        owner:
          type: ["string", "null"]
        resolution:
          type: ["string", "null"]
        resolved_at:
          type: ["string", "null"]
        severity:
          type: ["string", "null"]
        expected_updated_at:
          type: ["string", "null"]
          format: date-time

    # ── Sprint 2/3 — Meeting Action Items (new to the client) ───────────────
    MeetingActionItem:
      type: object
      required: [id, meeting_id, project_id, description, owner, status, priority, source]
      properties:
        id:
          type: integer
        meeting_id:
          type: integer
        project_id:
          type: integer
        description:
          type: string
        owner:
          type: string
        due_date:
          type: ["string", "null"]
        status:
          type: string
          default: open
        priority:
          type: string
          default: medium
        source:
          type: string
          default: manual
        completed_at:
          type: ["string", "null"]
        updated_at:
          type: ["string", "null"]
          format: date-time
        updated_by:
          type: ["integer", "null"]
        owner_id:
          type: ["integer", "null"]
        assigned_by:
          type: ["integer", "null"]
        assigned_at:
          type: ["string", "null"]
          format: date-time

    MeetingActionItemUpdate:
      type: object
      properties:
        status:
          type: ["string", "null"]
        owner:
          type: ["string", "null"]
        due_date:
          type: ["string", "null"]
        priority:
          type: ["string", "null"]
        completed_at:
          type: ["string", "null"]
        expected_updated_at:
          type: ["string", "null"]
          format: date-time

    SafetyEventUpdate:
      type: object
      properties:
        status:
          type: ["string", "null"]
        severity:
          type: ["string", "null"]
        corrective_action:
          type: ["string", "null"]
        expected_updated_at:
          type: ["string", "null"]
          format: date-time

    NcrUpdate:
      type: object
      properties:
        status:
          type: ["string", "null"]
        corrective_action:
          type: ["string", "null"]
        root_cause:
          type: ["string", "null"]
        expected_updated_at:
          type: ["string", "null"]
          format: date-time

    PurchaseRequestUpdate:
      type: object
      properties:
        status:
          type: ["string", "null"]
        rework_reason:
          type: ["string", "null"]
        expected_updated_at:
          type: ["string", "null"]
          format: date-time

    # ── Sprint 3 — Ownership Engine (shared assign/unassign shape) ──────────
    AssignRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: integer
        expected_updated_at:
          type: ["string", "null"]
          format: date-time

    UnassignRequest:
      type: object
      properties:
        expected_updated_at:
          type: ["string", "null"]
          format: date-time

    # ── Sprint 4 — Notifications ─────────────────────────────────────────
    Notification:
      type: object
      required: [id, organization_id, recipient_user_id, event_type, entity_type, entity_id,
                 title, message, severity, is_read, created_at]
      properties:
        id:
          type: integer
        organization_id:
          type: integer
        recipient_user_id:
          type: integer
        actor_user_id:
          type: ["integer", "null"]
        project_id:
          type: ["integer", "null"]
        event_type:
          type: string
        entity_type:
          type: string
        entity_id:
          type: integer
        title:
          type: string
        message:
          type: string
        severity:
          type: string
        action_url:
          type: ["string", "null"]
        is_read:
          type: boolean
        read_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    NotificationSummary:
      type: object
      required: [unread_count, total_count, unread_by_severity]
      properties:
        unread_count:
          type: integer
        total_count:
          type: integer
        unread_by_severity:
          type: object
          additionalProperties:
            type: integer

    MarkAllReadOut:
      type: object
      required: [updated_count]
      properties:
        updated_count:
          type: integer

    # ── Sprint 4/5 — Unified My Work Feed ────────────────────────────────
    MyWorkItem:
      type: object
      required: [entity_type, entity_id, title, status, is_overdue, is_due_soon, updated_at, action_url]
      properties:
        entity_type:
          type: string
        entity_id:
          type: integer
        project_id:
          type: ["integer", "null"]
        project_code:
          type: ["string", "null"]
        title:
          type: string
        status:
          type: string
        priority:
          type: ["string", "null"]
        due_date:
          type: ["string", "null"]
        is_overdue:
          type: boolean
        is_due_soon:
          type: boolean
        updated_at:
          type: string
          format: date-time
        action_url:
          type: string

    # ── Sprint 5 — Approval Engine ───────────────────────────────────────
    ApprovalRequest:
      type: object
      required: [id, organization_id, entity_type, entity_id, status, risk_level, created_at, updated_at]
      properties:
        id:
          type: integer
        organization_id:
          type: integer
        project_id:
          type: ["integer", "null"]
        entity_type:
          type: string
        entity_id:
          type: integer
        requested_by_user_id:
          type: ["integer", "null"]
        assigned_reviewer_id:
          type: ["integer", "null"]
        status:
          type: string
          enum: [Pending, "Under Review", Approved, Rejected, Returned, Cancelled]
        risk_level:
          type: string
        review_note:
          type: ["string", "null"]
        reviewed_by_user_id:
          type: ["integer", "null"]
        reviewed_at:
          type: ["string", "null"]
          format: date-time
        due_at:
          type: ["string", "null"]
          format: date-time
        target_version:
          type: ["integer", "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApprovalHistoryEntry:
      type: object
      required: [id, approval_request_id, new_status, created_at]
      properties:
        id:
          type: integer
        approval_request_id:
          type: integer
        previous_status:
          type: ["string", "null"]
        new_status:
          type: string
        actor_user_id:
          type: ["integer", "null"]
        note:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time

    ApprovalSummary:
      type: object
      required: [by_status, overdue_count, due_soon_count]
      properties:
        by_status:
          type: object
          additionalProperties:
            type: integer
        overdue_count:
          type: integer
        due_soon_count:
          type: integer

    ApprovalCreateRequest:
      type: object
      required: [entity_type, entity_id]
      properties:
        entity_type:
          type: string
          enum: [purchase_request, change_order, claim, document]
        entity_id:
          type: integer
        risk_level:
          type: string
          default: medium
        review_note:
          type: ["string", "null"]
        assigned_reviewer_id:
          type: ["integer", "null"]
        due_at:
          type: ["string", "null"]
          format: date-time

    ApprovalAssignRequest:
      type: object
      required: [reviewer_user_id]
      properties:
        reviewer_user_id:
          type: integer
        expected_updated_at:
          type: ["string", "null"]
          format: date-time

    ApprovalActionRequest:
      type: object
      properties:
        review_note:
          type: ["string", "null"]
        expected_updated_at:
          type: ["string", "null"]
          format: date-time

    ApprovalReasonRequiredRequest:
      type: object
      required: [review_note]
      properties:
        review_note:
          type: string
        expected_updated_at:
          type: ["string", "null"]
          format: date-time

    # ── Sprint 1/6 — Document storage (versions, download, archive) ─────
    Document:
      type: object
      required: [id, doc_type, title, doc_date, content_summary, is_archived]
      properties:
        id:
          type: integer
        project_id:
          type: ["integer", "null"]
        organization_id:
          type: ["integer", "null"]
        doc_type:
          type: string
        title:
          type: string
        doc_date:
          type: string
        content_summary:
          type: string
        original_filename:
          type: ["string", "null"]
        mime_type:
          type: ["string", "null"]
        file_size:
          type: ["integer", "null"]
        checksum:
          type: ["string", "null"]
        uploaded_at:
          type: ["string", "null"]
          format: date-time
        uploaded_by:
          type: ["integer", "null"]
        updated_at:
          type: ["string", "null"]
          format: date-time
        version_number:
          type: ["integer", "null"]
        is_archived:
          type: boolean

    DocumentVersion:
      type: object
      required: [version_number, original_filename, mime_type, file_size, checksum, uploaded_at, is_current]
      properties:
        version_number:
          type: integer
        original_filename:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
        checksum:
          type: string
        uploaded_at:
          type: string
          format: date-time
        uploaded_by:
          type: ["integer", "null"]
        is_current:
          type: boolean

    DocumentVersionUpload:
      allOf:
        - $ref: "#/components/schemas/DocumentVersion"
        - type: object
          required: [is_duplicate]
          properties:
            is_duplicate:
              type: boolean

    # ── Admin — user directory (existing, admin-role-only endpoint) ─────
    AdminUserOut:
      type: object
      required: [id, email, role, is_active, created_at, must_change_password]
      properties:
        id:
          type: integer
        email:
          type: string
        full_name:
          type: ["string", "null"]
        role:
          type: string
        is_active:
          type: boolean
        organization_id:
          type: ["integer", "null"]
        created_at:
          type: string
          format: date-time
        last_login:
          type: ["string", "null"]
          format: date-time
        must_change_password:
          type: boolean

    Claim:
      type: object
      required: [id, project_id, claim_number, claim_type, amount, status, narrative]
      properties:
        id:
          type: integer
        project_id:
          type: integer
        claim_number:
          type: string
        claim_type:
          type: string
        amount:
          type: number
        status:
          type: string
        narrative:
          type: string

    ProjectMembership:
      type: object
      required: [id, user_id, project_id, role_on_project, is_active, created_at]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        project_id:
          type: integer
        role_on_project:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

