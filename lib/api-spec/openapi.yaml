      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Version history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentVersion"
        "404":
          description: Not found
    post:
      operationId: uploadDocumentVersion
      tags: [documents]
      summary: Upload a new version of a document's file
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: New (or, if byte-identical, existing) current version
          content:
            application/json:
              schema:
